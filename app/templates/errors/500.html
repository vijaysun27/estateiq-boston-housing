{% extends "base.html" %}

{% block title %}500 — Internal Server Error | EstateIQ{% endblock %}

{% block content %}
<div class="container error-page">
    <div class="card error-card">
        <div class="error-code">500</div>
        <h1 class="error-title">Internal Server Error</h1>
        <p class="error-desc">An unexpected issue occurred while processing your request. Please try again or return to the predictor dashboard.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Predictor</a>
    </div>
</div>
{% endblock %}
